<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9E782F" />
    </linearGradient>
    <linearGradient id="terracottaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C86A46" />
      <stop offset="100%" stop-color="#8C4326" />
    </linearGradient>
  </defs>

  <!-- Background subtle warm circle -->
  <circle cx="200" cy="200" r="190" fill="#FAF7F2" />
  
  <!-- Outer delicate rings -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3 3" />
  <circle cx="200" cy="200" r="174" fill="none" stroke="#8C4326" stroke-width="1" stroke-opacity="0.4" />

  <!-- Center Emblem Graphic -->
  <g transform="translate(200, 155)">
    <!-- Aura Rays / Petal halo -->
    <circle cx="0" cy="-10" r="48" fill="none" stroke="#C5A059" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 4" />

    <!-- Stylized Lotus Blossom -->
    <!-- Center petal -->
    <path d="M0 -42 C-7 -25 -5 -10 0 0 C5 -10 7 -25 0 -42 Z" fill="url(#goldGradient)" />
    <!-- Left petals -->
    <path d="M-4 -3 C-18 -15 -28 -32 -20 -40 C-12 -35 -5 -15 -2 -2 Z" fill="#C5A059" fill-opacity="0.85" />
    <path d="M-6 0 C-24 -5 -38 -16 -34 -25 C-26 -22 -14 -8 -3 1 Z" fill="#C5A059" fill-opacity="0.65" />
    <!-- Right petals -->
    <path d="M4 -3 C18 -15 28 -32 20 -40 C12 -35 5 -15 2 -2 Z" fill="url(#goldGradient)" fill-opacity="0.85" />
    <path d="M6 0 C24 -5 38 -16 34 -25 C26 -22 14 -8 3 1 Z" fill="url(#goldGradient)" fill-opacity="0.65" />

    <!-- Center Sparkle Star -->
    <path d="M0 -56 L2 -48 L10 -46 L2 -44 L0 -36 L-2 -44 L-10 -46 L-2 -48 Z" fill="#D4AF37" />

    <!-- Graceful Hand Line-Art Cupping the Lotus -->
    <!-- Palm & wrist line -->
    <path d="M-35 32 C-20 45 10 46 36 28 C30 22 24 16 15 16 C6 16 -12 20 -28 14 C-33 12 -36 18 -35 32 Z" 
          fill="url(#terracottaGradient)" />
    <!-- Graceful finger curves -->
    <path d="M-28 14 C-20 8 -8 8 2 12 C10 15 18 13 26 8 C22 4 12 2 0 4 C-14 6 -24 9 -28 14 Z" 
          fill="#8C4326" fill-opacity="0.8" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Title -->
  <text x="200" y="270" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Cormorant Garamond', serif" 
        font-size="25" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#1C1917">
    HAATH KI KALA
  </text>

  <!-- Tagline / Subtitle -->
  <text x="200" y="295" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="8.5" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#8C4326">
    CONTEMPORARY ARTISANAL LIVING
  </text>

  <!-- Small Est / Origin divider -->
  <line x1="140" y1="312" x2="260" y2="312" stroke="#C5A059" stroke-width="0.8" stroke-opacity="0.6" />
  <circle cx="200" cy="312" r="2.5" fill="#C5A059" />
  
  <text x="200" y="328" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="7" 
        font-weight="500" 
        letter-spacing="2.5" 
        fill="#78716C">
    HANDMADE IN INDIA • ESTD. 2024
  </text>
</svg>
